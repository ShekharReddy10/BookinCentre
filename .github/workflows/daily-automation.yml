name: Daily Automation

on:
  schedule:
    # 03:00 UTC daily — adjust to whenever "tomorrow" reminders should fire for your timezone
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  ical-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync iCal feeds (Airbnb/Booking.com/etc)
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_URL }}/automation/sync-ical-feeds" \
            -H "X-Automation-Secret: ${{ secrets.AUTOMATION_SECRET }}"

  daily-reminders:
    runs-on: ubuntu-latest
    needs: ical-sync
    steps:
      - name: Send daily reminders (arrivals, checkouts, pending payments, summary)
        run: |
          curl -fsS -X POST "${{ secrets.BACKEND_URL }}/automation/run-daily-reminders" \
            -H "X-Automation-Secret: ${{ secrets.AUTOMATION_SECRET }}"
